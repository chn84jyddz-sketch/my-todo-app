        function addTask() {
            const input = document.getElementById('taskInput');
            const range = document.getElementById('priority');
            const importantSwitch = document.getElementById('important');
            const memoInput = document.getElementById('taskMemo');
            const dueInput = document.getElementById('taskDue');
            const timeInput = document.getElementById('taskTime');
            const text = input.value.trim();

            if (text === '') {
                ons.notification.toast('タスクを入力してください', { timeout: 1800 });
                input.focus();
                return;
            }

            if (timeInput.value && !dueInput.value) {
                ons.notification.toast('時刻を入れるときは日付も選んでください', { timeout: 2000 });
                dueInput.focus();
                return;
            }

            const endInput = document.getElementById('taskEndTime');
            if (endInput.value && !timeInput.value) {
                ons.notification.toast('終了時刻を入れるときは開始時刻も入れてください', { timeout: 2200 });
                timeInput.focus();
                return;
            }
            if (endInput.value && endInput.value <= timeInput.value) {
                ons.notification.toast('終了時刻は開始時刻より後にしてください', { timeout: 2200 });
                endInput.focus();
                return;
            }

            const repeatValue = document.getElementById('taskRepeat').value;
            if (repeatValue && !dueInput.value) {
                ons.notification.toast('繰り返しには期限の日付が必要です', { timeout: 2000 });
                dueInput.focus();
                return;
            }

            const fields = {
                text: text,
                priority: Number(range.value),
                important: importantSwitch.checked,
                memo: memoInput.value.trim(),
                genre: genreById(addGenre) ? addGenre : '',
                due: dueInput.value,
                time: timeInput.value,
                endTime: endInput.value,
                repeat: repeatValue
            };

            if (editingTaskId !== null) {
                // 編集：完了状態やIDはそのまま、内容だけ更新する
                const target = tasks.find(function (t) { return t.id === editingTaskId; });
                if (!target) {
                    ons.notification.toast('このタスクは見つかりませんでした', { timeout: 2000 });
                    resetTaskForm();
                    closeAddDialog();
                    return;
                }
                Object.assign(target, fields);
            } else {
                tasks.push(Object.assign({ id: newId(), completed: false }, fields));
            }

            resetTaskForm();
            saveTasks();
            renderTasks();
            closeAddDialog();
        }

        // ---- 期限の扱い ----
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        // 期限の開始日時を返す（期限がなければ null）
        function parseDue(task) {
            if (!task.due) return null;
            const d = task.due.split('-').map(Number);
            if (!d[0] || !d[1] || !d[2]) return null;
            if (task.time) {
                const t = task.time.split(':').map(Number);
                return new Date(d[0], d[1] - 1, d[2], t[0] || 0, t[1] || 0);
            }
            return new Date(d[0], d[1] - 1, d[2]);
        }

        function isOverdue(task) {
            const start = parseDue(task);
            if (!start || task.completed) return false;
            // 時刻なしの期限は、その日の終わりまで有効
            let limit = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
            if (task.time) {
                limit = start;
                if (task.endTime) {
                    const e = task.endTime.split(':').map(Number);
                    limit = new Date(start.getFullYear(), start.getMonth(), start.getDate(), e[0] || 0, e[1] || 0);
                }
            }
            return limit < new Date();
        }

        function formatDueLabel(task) {
            return task.due.replace(/-/g, '/') + (task.time ? ' ' + task.time : '') + (task.endTime ? '〜' + task.endTime : '');
        }

        // ---- アプリ内カレンダー（月表示）----
        function toDateKey(d) {
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        const now0 = new Date();
        let calYear = now0.getFullYear();
        let calMonth = now0.getMonth(); // 0〜11
        let calSelected = toDateKey(now0);

        function changeMonth(delta) {
            const d = new Date(calYear, calMonth + delta, 1);
            calYear = d.getFullYear();
            calMonth = d.getMonth();
            // 表示月が今月なら今日、それ以外は1日を選択
            const today = new Date();
            const isThisMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;
            calSelected = toDateKey(isThisMonth ? today : d);
            renderCalendar();
        }

        function goToday() {
            const today = new Date();
            calYear = today.getFullYear();
            calMonth = today.getMonth();
            calSelected = toDateKey(today);
            renderCalendar();
        }

        // ---- 日本の祝日（2007年以降。インターネットなしで計算する）----
        const holidayCache = {};

        function holidaysOf(y) {
            if (holidayCache[y]) return holidayCache[y];
            const h = {};
            const k = function (m, d) { return y + '-' + pad(m) + '-' + pad(d); };
            // m月の第n月曜日
            const monday = function (m, n) {
                const f = new Date(y, m - 1, 1).getDay();
                return 1 + (8 - f) % 7 + (n - 1) * 7;
            };
            const equinox = function (base) {
                return Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
            };

            h[k(1, 1)] = '元日';
            h[k(1, monday(1, 2))] = '成人の日';
            h[k(2, 11)] = '建国記念の日';
            if (y >= 2020) h[k(2, 23)] = '天皇誕生日';
            h[k(3, equinox(20.8431))] = '春分の日';
            h[k(4, 29)] = '昭和の日';
            h[k(5, 3)] = '憲法記念日';
            h[k(5, 4)] = 'みどりの日';
            h[k(5, 5)] = 'こどもの日';
            // オリンピックの年だけ日付が違う祝日
            h[y === 2020 ? k(7, 23) : y === 2021 ? k(7, 22) : k(7, monday(7, 3))] = '海の日';
            h[y === 2020 ? k(8, 10) : y === 2021 ? k(8, 8) : k(8, 11)] = '山の日';
            h[k(9, monday(9, 3))] = '敬老の日';
            h[k(9, equinox(23.2488))] = '秋分の日';
            h[y === 2020 ? k(7, 24) : y === 2021 ? k(7, 23) : k(10, monday(10, 2))] = 'スポーツの日';
            h[k(11, 3)] = '文化の日';
            h[k(11, 23)] = '勤労感謝の日';

            // 国民の休日：祝日にはさまれた平日（9月）
            for (let d = 2; d < 30; d++) {
                const dt = new Date(y, 8, d);
                if (dt.getDay() !== 0 && !h[k(9, d)] && h[k(9, d - 1)] && h[k(9, d + 1)]) h[k(9, d)] = '国民の休日';
            }
            // 振替休日：日曜と重なった祝日の次の平日
            Object.keys(h).forEach(function (key) {
                const p = key.split('-').map(Number);
                const dt = new Date(p[0], p[1] - 1, p[2]);
                if (dt.getDay() !== 0) return;
                do { dt.setDate(dt.getDate() + 1); } while (h[toDateKey(dt)]);
                h[toDateKey(dt)] = '振替休日';
            });

            holidayCache[y] = h;
            return h;
        }

        function holidayName(key) {
            return holidaysOf(Number(key.slice(0, 4)))[key] || '';
        }

        function bindCalendarSwipe(grid) {
            if (grid.dataset.swipe) return;
            grid.dataset.swipe = '1';
            let sx = 0, sy = 0;
            // タブの横スワイプと混ざらないよう、ここで止める
            grid.addEventListener('touchstart', function (e) {
                e.stopPropagation();
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
            }, { passive: true });
            grid.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
            grid.addEventListener('touchend', function (e) {
                const p = e.changedTouches[0];
                const dx = p.clientX - sx, dy = p.clientY - sy;
                if (Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * 0.5) changeMonth(dx < 0 ? 1 : -1);
            }, { passive: true });
        }

        let lastTap = { key: '', time: 0 };

        function chipTextColor(hex) {
            const n = parseInt(hex.slice(1), 16);
            const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
            return (r * 299 + g * 587 + b * 114) / 1000 > 160 ? '#1a202c' : '#fff';
        }

        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const title = document.getElementById('calTitle');
            const heading = document.getElementById('calDayHeading');
            const dayList = document.getElementById('calDayList');
            const dayEmpty = document.getElementById('calDayEmpty');
            // カレンダーのページがまだ生成されていなければ何もしない
            if (!grid || !title || !heading || !dayList || !dayEmpty) return;

            title.textContent = calYear + '年' + (calMonth + 1) + '月';
            bindCalendarSwipe(grid);
            grid.replaceChildren();

            ['日', '月', '火', '水', '木', '金', '土'].forEach(function (w, i) {
                const cell = document.createElement('div');
                cell.className = 'cal-weekday' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
                cell.textContent = w;
                grid.appendChild(cell);
            });

            const firstWeekday = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const todayKey = toDateKey(new Date());

            // 日付ごとのタスク
            const byDate = {};
            tasks.filter(matchesGenre).forEach(function (task) {
                if (task.due) (byDate[task.due] = byDate[task.due] || []).push(task);
            });

            for (let i = 0; i < firstWeekday; i++) {
                const blank = document.createElement('div');
                blank.className = 'cal-blank';
                grid.appendChild(blank);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const key = calYear + '-' + pad(calMonth + 1) + '-' + pad(day);
                const weekday = (firstWeekday + day - 1) % 7;
                const dayTasks = byDate[key] || [];
                const button = document.createElement('button');
                const num = document.createElement('span');

                button.type = 'button';
                button.className = 'cal-day'
                    + (weekday === 0 || holidayName(key) ? ' sun' : weekday === 6 ? ' sat' : '')
                    + (key === todayKey ? ' today' : '')
                    + (key === calSelected ? ' selected' : '');
                button.setAttribute('aria-label',
                    (calMonth + 1) + '月' + day + '日' + (holidayName(key) ? ' ' + holidayName(key) : '')
                    + ' タスク' + dayTasks.length + '件');
                num.className = 'cal-num';
                num.textContent = day;
                button.appendChild(num);

                if (dayTasks.length > 0) {
                    const MAX_CHIPS = 3; // 1日に表示する帯の数（残りは「+N」）
                    const ordered = sortedTasks(dayTasks).sort(function (a, b) {
                        return Number(a.completed) - Number(b.completed); // 未完了を上に
                    });
                    ordered.slice(0, MAX_CHIPS).forEach(function (task) {
                        const color = genreColor(task.genre);
                        const chip = document.createElement('span');
                        chip.className = 'cal-chip'
                            + (task.completed ? ' done' : '')
                            + (isOverdue(task) ? ' overdue' : '');
                        chip.style.background = color;
                        chip.style.color = chipTextColor(color);
                        chip.textContent = task.text;
                        button.appendChild(chip);
                    });
                    if (ordered.length > MAX_CHIPS) {
                        const more = document.createElement('span');
                        more.className = 'cal-more';
                        more.textContent = '+' + (ordered.length - MAX_CHIPS);
                        button.appendChild(more);
                    }
                }

                button.addEventListener('click', function () {
                    const doubleTap = lastTap.key === key && Date.now() - lastTap.time < 400;
                    lastTap = { key: key, time: doubleTap ? 0 : Date.now() };
                    calSelected = key;
                    renderCalendar();
                    if (doubleTap) openAddDialog(); // 同じ日を2回タップでその日のタスクを追加
                });
                grid.appendChild(button);
            }

            // 選択した日のタスク一覧
            const parts = calSelected.split('-').map(Number);
            heading.textContent = parts[0] + '年' + parts[1] + '月' + parts[2] + '日のタスク'
                + (holidayName(calSelected) ? '（' + holidayName(calSelected) + '）' : '');
            dayList.replaceChildren();
            const selectedTasks = sortedTasks(byDate[calSelected] || []).sort(function (a, b) {
                return (a.time || '99:99') < (b.time || '99:99') ? -1 : (a.time || '99:99') > (b.time || '99:99') ? 1 : 0;
            });
            if (selectedTasks.length === 0) {
                dayEmpty.textContent = 'この日のタスクはありません。右下の「＋」で追加できます。';
                dayEmpty.hidden = false;
            } else {
                dayEmpty.hidden = true;
                selectedTasks.forEach(function (task) {
                    dayList.appendChild(buildTaskItem(task));
                });
            }
        }

        // ---- 一覧の描画 ----
        // 重要タスク → 優先度の高い順（同順位は追加順）
        function sortedTasks(list) {
            return list
                .map(function (task, index) { return { task: task, index: index }; })
                .sort(function (a, b) {
                    return (Number(b.task.important) - Number(a.task.important))
                        || (b.task.priority - a.task.priority)
                        || (a.index - b.index);
                })
                .map(function (entry) { return entry.task; });
        }

        // 1件分のタスク行を作る（各タブとカレンダーで共通）
        function buildTaskItem(task) {
            const item = document.createElement('ons-list-item');
            const row = document.createElement('div');
            const checkbox = document.createElement('ons-checkbox');
            const textArea = document.createElement('div');
            const title = document.createElement('div');
            const details = document.createElement('small');
            const deleteButton = document.createElement('ons-button');

            row.className = 'todo-row';
            row.style.borderLeft = '4px solid ' + genreColor(task.genre);
            row.style.paddingLeft = '8px';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', function () {
                task.completed = checkbox.checked; // 配列内のオブジェクトを直接更新
                task.doneAt = task.completed ? Date.now() : 0;
                if (task.completed && task.repeat && task.due && !task.spawned) {
                    const nextDue = nextDueKey(task);
                    task.spawned = true;
                    tasks.push(Object.assign({}, task, {
                        id: newId(), completed: false, doneAt: 0, spawned: false, due: nextDue
                    }));
                    ons.notification.toast('次の予定（' + nextDue.replace(/-/g, '/') + '）を作りました', { timeout: 2500 });
                }
                saveTasks();
                // ToDo⇄完了のタブでは、行が消えて移ることが分かるよう少し薄くしてから描画し直す
                const listId = item.dataset.list || '';
                const moving = ((listId === 'openList' || listId === 'allList') && task.completed)
                    || (listId === 'doneList' && !task.completed);
                if (moving) {
                    item.style.transition = 'opacity 0.3s';
                    item.style.opacity = '0';
                    setTimeout(renderTasks, 300);
                } else {
                    renderTasks();
                }
            });

            textArea.className = 'todo-text';
            title.className = 'todo-title'
                + (task.completed ? ' completed' : '')
                + (task.important ? ' important' : '');
            title.textContent = (task.important ? '★ ' : '') + task.text;
            details.className = 'task-details';
            details.textContent = '優先度 ' + task.priority + ' / 5'
                + (task.important ? ' ・重要' : '');
            textArea.append(title, details);

            if (task.due) {
                const due = document.createElement('small');
                due.className = 'task-details task-due' + (isOverdue(task) ? ' overdue' : '');
                due.textContent = (task.time ? '予定 ' : '期限 ') + formatDueLabel(task) + (isOverdue(task) ? '（期限切れ）' : '');
                textArea.appendChild(due);
            }
            const extra = [];
            if (task.repeat) extra.push('🔁 ' + { daily: '毎日', weekly: '毎週', monthly: '毎月' }[task.repeat]);
            if (task.completed && task.doneAt) {
                const dd = new Date(task.doneAt);
                extra.push('完了 ' + (dd.getMonth() + 1) + '/' + dd.getDate());
            }
            if (extra.length > 0) {
                const info = document.createElement('small');
                info.className = 'task-details';
                info.textContent = extra.join(' ・');
                textArea.appendChild(info);
            }
            if (task.memo) {
                const memo = document.createElement('div');
                memo.className = 'task-memo';
                memo.textContent = task.memo; // textContent なので HTML は実行されない
                textArea.appendChild(memo);
            }

            // ジャンル表示（タップで付け替え）
            const g = genreById(task.genre);
            const tag = document.createElement('button');
            const tagDot = document.createElement('span');
            tag.type = 'button';
            tag.className = 'genre-tag';
            tagDot.className = 'dot';
            tagDot.style.background = genreColor(task.genre);
            tag.append(tagDot, document.createTextNode(g ? g.name : '未分類'));
            tag.addEventListener('click', function () { changeTaskGenre(task); });
            textArea.appendChild(tag);

            deleteButton.setAttribute('modifier', 'quiet');
            deleteButton.textContent = '削除';
            deleteButton.addEventListener('click', function () {
                tasks = tasks.filter(function (t) { return t.id !== task.id; });
                saveTasks();
                renderTasks();
            });

            const editButton = document.createElement('ons-button');
            editButton.setAttribute('modifier', 'quiet');
            editButton.textContent = '編集';
            editButton.addEventListener('click', function () { openEditDialog(task); });

            row.append(checkbox, textArea, editButton, deleteButton);
            item.appendChild(row);
            return item;
        }

        function renderList(listId, emptyId, summaryId, filter) {
            const list = document.getElementById(listId);
            const emptyMessage = document.getElementById(emptyId);
            const summary = document.getElementById(summaryId);
            // そのタブのページがまだ生成されていなければ何もしない（生成時の init で再描画される）
            if (!list || !emptyMessage || !summary) return;

            let scoped = tasks.filter(matchesGenre);
            if (filter === 'today') {
                const todayKey = toDateKey(new Date());
                scoped = scoped.filter(function (task) { return task.due === todayKey; });
            }
            const unfinished = scoped.filter(function (task) {
                return !task.completed;
            }).length;
            summary.textContent = filter === 'today'
                ? '残り ' + unfinished + '件（今日の全' + scoped.length + '件）'
                : '未完了 ' + unfinished + '件 / 全' + scoped.length + '件';
            list.replaceChildren();

            const visibleTasks = sortedTasks(scoped.filter(function (task) {
                if (filter === 'open' || filter === 'today') return !task.completed;
                if (filter === 'done') return task.completed;
                return true;
            }));

            if (visibleTasks.length === 0) {
                emptyMessage.textContent = filter === 'open'
                    ? 'ToDoはありません。'
                    : filter === 'done'
                        ? '完了したタスクはありません。'
                        : (scoped.length > 0
                            ? '今日のタスクはすべて完了しました。'
                            : '今日が期限のタスクはありません。右下の「＋」から追加できます。');
                emptyMessage.hidden = false;
                return;
            }
            emptyMessage.hidden = true;

            function makeRow(task) {
                const row = buildTaskItem(task);
                row.dataset.list = listId; // チェック時に消える動きを付けるための目印
                return row;
            }

            if (!folderState.mode) {
                const flat = document.createElement('ons-list');
                visibleTasks.forEach(function (task) { flat.appendChild(makeRow(task)); });
                list.appendChild(flat);
                return;
            }

            // ジャンルごとのフォルダ（ジャンルの並び順 → 未分類）
            const groups = genres.map(function (g) {
                return { id: g.id, name: g.name, color: g.color, tasks: [] };
            });
            groups.push({ id: 'none', name: '未分類', color: NO_GENRE_COLOR, tasks: [] });
            visibleTasks.forEach(function (task) {
                const g = genreById(task.genre);
                const key = g ? g.id : 'none';
                groups.find(function (grp) { return grp.id === key; }).tasks.push(task);
            });

            groups.filter(function (grp) { return grp.tasks.length > 0; }).forEach(function (grp) {
                const collapsed = Boolean(folderState.collapsed[grp.id]);
                const folder = document.createElement('div');
                const head = document.createElement('button');
                const chev = document.createElement('span');
                const icon = document.createElement('span');
                const name = document.createElement('span');
                const count = document.createElement('span');

                folder.className = 'folder';
                head.type = 'button';
                head.className = 'folder-head';
                head.style.borderLeftColor = grp.color;
                head.setAttribute('aria-expanded', String(!collapsed));
                chev.className = 'folder-chev';
                chev.textContent = collapsed ? '▸' : '▾';
                icon.textContent = collapsed ? '📁' : '📂';
                name.className = 'folder-name';
                name.textContent = grp.name;
                count.className = 'folder-count';
                count.textContent = grp.tasks.length + '件';
                head.append(chev, icon, name, count);
                head.addEventListener('click', function () {
                    folderState.collapsed[grp.id] = !collapsed;
                    if (!folderState.collapsed[grp.id]) delete folderState.collapsed[grp.id];
                    saveFolderState();
                    renderTasks();
                });
                folder.appendChild(head);

                if (!collapsed) {
                    const inner = document.createElement('ons-list');
                    grp.tasks.forEach(function (task) { inner.appendChild(makeRow(task)); });
                    folder.appendChild(inner);
                }
                list.appendChild(folder);
            });
        }

        function renderTasks() {
            renderList('allList', 'allEmpty', 'summaryAll', 'today');
            renderList('openList', 'openEmpty', 'summaryOpen', 'open');
            renderList('doneList', 'doneEmpty', 'summaryDone', 'done');
            renderGenreBars();
            renderGenreList();
            renderCalendar();
            renderNotes();
        }

        // ---- 繰り返しタスク：次の期限日を求める ----
        function nextDueKey(task) {
            const p = task.due.split('-').map(Number);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            for (let n = 1; n < 1000; n++) {
                let d;
                if (task.repeat === 'daily') {
                    d = new Date(p[0], p[1] - 1, p[2] + n);
                } else if (task.repeat === 'weekly') {
                    d = new Date(p[0], p[1] - 1, p[2] + 7 * n);
                } else {
                    const last = new Date(p[0], p[1] + n, 0).getDate(); // 31日→30日の月などに対応
                    d = new Date(p[0], p[1] - 1 + n, Math.min(p[2], last));
                }
                if (d >= today) return toDateKey(d); // 溜まっていても今日以降の最初の日にする
            }
            return task.due;
        }

        // ---- 完了タスクの整理 ----
        function cleanupDone(days) {
            const limit = Date.now() - days * 86400000;
            const targets = tasks.filter(function (t) {
                return t.completed && (days === 0 || (t.doneAt || 0) < limit);
            });
            if (targets.length === 0) {
                ons.notification.toast('削除する完了タスクはありません', { timeout: 2000 });
                return;
            }
            ons.notification.confirm(
                '完了したタスク' + targets.length + '件を削除しますか？（元に戻せません）',
                { buttonLabels: ['キャンセル', '削除'] }
            ).then(function (index) {
                if (index !== 1) return;
                tasks = tasks.filter(function (t) { return targets.indexOf(t) < 0; });
                saveTasks();
                renderTasks();
            });
        }

        // ---- 期限のリマインド（アプリを開いている間だけ動作）----
        const NOTIFIED_KEY = 'onsenTodoNotified';
        const REMIND_MIN = 10; // 期限の何分前に知らせるか

        function loadNotified() {
            try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch (e) { return {}; }
        }

        function enableNotifications() {
            closeMenu();
            if (!('Notification' in window)) {
                ons.notification.alert('この環境は通知に対応していません。期限が近いときはアプリ内に表示します。');
                return;
            }
            Notification.requestPermission().then(function (p) {
                ons.notification.toast(p === 'granted' ? '通知をオンにしました' : '通知が許可されませんでした', { timeout: 2500 });
            });
        }

        function checkReminders() {
            const notified = loadNotified();
            const now = Date.now();
            let changed = false;
            tasks.forEach(function (task) {
                if (task.completed || !task.time) return;
                const due = parseDue(task);
                if (!due) return;
                const mark = task.id + '|' + task.due + ' ' + task.time;
                const diff = due.getTime() - now;
                // 通知済み、まだ先、1時間以上過ぎたものは対象外
                if (notified[mark] || diff > REMIND_MIN * 60000 || diff < -3600000) return;
                notified[mark] = now;
                changed = true;
                const msg = (diff > 0 ? 'あと' + Math.ceil(diff / 60000) + '分：' : '期限です：') + task.text;
                if (window.Notification && Notification.permission === 'granted') {
                    try { new Notification('ToDoリスト', { body: msg }); } catch (e) { /* 通知できない環境では画面内の表示だけ */ }
                }
                ons.notification.toast(msg, { timeout: 6000 });
            });
            Object.keys(notified).forEach(function (k) {
                if (notified[k] < now - 7 * 86400000) { delete notified[k]; changed = true; }
            });
            if (changed) {
                try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified)); } catch (e) { /* 次回また試す */ }
            }
        }

        function startReminders() {
            setTimeout(checkReminders, 3000); // クラウドのデータが入ってから
            setInterval(checkReminders, 30000);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) checkReminders();
            });
        }

        ons.ready(function () {
            // ページ（各タブ）が生成されるたびに描画する。
            // これで再読み込み直後も、保存済みタスクが最初から表示される。
            document.addEventListener('init', function () {
                renderTasks();
                // タブ切り替え時に、メモタブでは追加ボタンを隠す（1回だけ登録）
                const tabs = document.getElementById('filterTabs');
                if (tabs && !tabs.dataset.bound) {
                    tabs.dataset.bound = '1';
                    tabs.addEventListener('postchange', updateFab);
                }
            });

            // サブ画面（ジャンル管理・使い方・メモ）では、横にスワイプ（右へも左へも）すると前の画面に戻る
            const nav = document.getElementById('navigator');

            let swipe = null;

            function menuIsOpen() {
                const side = document.getElementById('sideMenu');
                if (typeof side.isOpen === 'boolean') return side.isOpen;
                return side.getBoundingClientRect().right > 20; // 開いているときは画面の左側に見えている
            }

            document.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) { swipe = null; return; }
                const menu = menuIsOpen();
                swipe = (menu || nav.pages.length > 1)
                    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, menu: menu } : null;
            }, { passive: true });

            // 指を動かしている途中で判定する（途中でキャンセルされても反応するように）
            document.addEventListener('touchmove', function (e) {
                if (!swipe || e.touches.length !== 1) return;
                const t = e.touches[0];
                const dx = t.clientX - swipe.x;
                const dy = t.clientY - swipe.y;
                if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; } // 縦のスクロール

                if (swipe.menu) {
                    // メニューが開いているときは、画面のどこでも右から左へスワイプで閉じる
                    if (dx < -50 && Math.abs(dy) < Math.abs(dx) * 0.6) { swipe = null; closeMenu(); }
                    return;
                }

                // サブ画面では、画面のどこでも横にスワイプで前の画面に戻る
                if (Math.abs(dx) < 80 || Math.abs(dy) > Math.abs(dx) * 0.5) return;
                const sel = window.getSelection();
                const busy = Array.from(document.querySelectorAll('ons-dialog, ons-alert-dialog, ons-action-sheet'))
                    .some(function (d) { return d.visible; });
                swipe = null;
                if ((sel && sel.toString() !== '') || busy || nav.pages.length < 2) return;
                try { nav.popPage(); } catch (err) { /* 画面の切り替え中は何もしない */ }
            }, { passive: true });

            function endSwipe() { swipe = null; }
            document.addEventListener('touchend', endSwipe, { passive: true });
            document.addEventListener('touchcancel', endSwipe, { passive: true });

            // Enterキーで追加
            document.getElementById('taskInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.isComposing) addTask(); // 日本語変換中のEnterは除く
            });

            renderTasks();
            startReminders();
        });
    </script>
