<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDoリスト</title>
    <!-- バージョンを固定して、将来の更新で壊れないようにする -->
    <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.8/css/onsenui.css">
    <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.8/css/onsen-css-components.min.css">
    <script src="https://unpkg.com/onsenui@2.12.8/js/onsenui.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            height: 100%;
        }

        body {
            background: #f5f7fa;
            height: 100%;
            margin: 0;
            overflow: hidden;
            /* 画面全体がずれたり横に揺れたりしないように */
            overscroll-behavior: none;
        }

        #appSplitter {
            height: 100%;
        }

        /* 上のバーが薄く見えないように、色をはっきりさせる */
        .toolbar {
            background-color: #f7f7f8;
        }

        .toolbar__center,
        .toolbar__title {
            color: #1a202c;
            opacity: 1;
        }

        .toolbar-button,
        .back-button {
            color: #007aff;
            opacity: 1;
        }

        .toolbar-button ons-icon {
            font-size: 24px;
        }

        /* メモの編集画面：下の余白まで白い紙にする */
        #noteEditorPage .page__background,
        #noteEditorPage .page__content {
            background: #fff;
        }

        /* タブが5つ並んでも収まるように */
        .tabbar__label {
            font-size: 12px;
            white-space: nowrap;
        }

        ons-tab {
            min-width: 0;
        }

        .page-content {
            padding: 12px 12px 88px;
            /* 下側は追加ボタン(FAB)に隠れない余白 */
        }

        .intro {
            margin: 8px 0 12px;
            color: #536273;
        }

        .summary {
            margin: 12px 0;
            color: #536273;
            font-size: 14px;
        }

        .todo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .todo-text {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .todo-title.completed {
            color: #89939d;
            text-decoration: line-through;
        }

        .todo-title.important {
            font-weight: bold;
        }

        .important-mark {
            color: #e53935;
        }


        /* カレンダー */
        .cal-header {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .cal-title {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 2px;
        }

        .cal-weekday {
            padding: 4px 0;
            text-align: center;
            color: #718096;
            font-size: 12px;
        }

        .cal-weekday.sun {
            color: #e53935;
        }

        .cal-weekday.sat {
            color: #1e88e5;
        }

        .cal-blank {
            min-height: 44px;
        }

        .cal-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            min-width: 0;
            min-height: 44px;
            padding: 2px 0;
            border: none;
            border-radius: 8px;
            background: #fff;
            font: inherit;
            cursor: pointer;
        }

        .cal-day.sun .cal-num {
            color: #e53935;
        }

        .cal-day.sat .cal-num {
            color: #1e88e5;
        }

        .cal-day.today .cal-num {
            background: #1e88e5;
            color: #fff;
        }

        .cal-day.selected {
            outline: 2px solid #1e88e5;
        }

        .cal-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            line-height: 22px;
            text-align: center;
            font-size: 13px;
        }

        .cal-mark {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #536273;
            font-size: 10px;
        }

        .cal-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1e88e5;
        }

        .cal-dot.done {
            background: #a0aec0;
        }

        .cal-dot.overdue {
            background: #e53935;
        }

        /* カレンダーのタスク帯 */
        .cal-blank {
            min-height: 84px;
        }

        .cal-day {
            justify-content: flex-start;
            min-height: 84px;
            padding: 3px 1px;
        }

        .cal-num {
            flex-shrink: 0;
        }

        .cal-chip {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 1px 3px;
            border-radius: 3px;
            font-size: 10px;
            line-height: 13px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cal-chip.done {
            opacity: 0.45;
            text-decoration: line-through;
        }

        .cal-chip.overdue {
            box-shadow: inset 0 0 0 1.5px #e53935;
        }

        .cal-more {
            color: #718096;
            font-size: 10px;
            line-height: 12px;
        }

        .cal-day-heading {
            margin: 18px 0 4px;
            font-size: 15px;
            color: #2d3748;
        }

        .task-due.overdue {
            color: #e53935;
            font-weight: bold;
        }

        .task-memo {
            margin-top: 4px;
            color: #4a5568;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .todo-row {
            gap: 8px;
        }

        .todo-row ons-button {
            min-width: 0;
            padding: 0 4px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .field-label {
            display: block;
            margin: 12px 0 4px;
            color: #536273;
            font-size: 13px;
        }

        .dialog-body input,
        .dialog-body textarea {
            font-size: 16px;
            /* 16px未満だとiPhoneで入力時に画面が拡大される */
        }

        .native-field {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 8px;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
            min-height: 38px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: #fff;
        }

        .date-row {
            display: flex;
            gap: 6px;
        }

        .date-row .native-field {
            flex: 1;
            min-width: 0;
        }

        .task-details {
            display: block;
            margin-top: 3px;
            color: #718096;
            font-size: 12px;
        }

        .empty-message {
            padding: 24px 12px;
            color: #718096;
            text-align: center;
        }

        /* メモ（箇条書き） */
        .memo-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .memo-input-row .native-field {
            flex: 1;
            font-size: 16px;
        }

        .memo-bullet {
            color: #536273;
            font-weight: bold;
        }

        .memo-text {
            cursor: pointer;
        }

        /* ジャンル（色分け） */
        .genre-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 4px 0 12px;
        }

        .genre-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 999px;
            background: #fff;
            color: #2d3748;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .genre-chip.active {
            border-color: transparent;
            color: #fff;
        }

        .genre-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .genre-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding: 1px 8px;
            border: none;
            border-radius: 999px;
            background: #edf2f7;
            color: #4a5568;
            font: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        .genre-tag .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .genre-row-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            margin: 12px 0 18px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            padding: 0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .color-swatch.selected {
            outline: 3px solid #a0aec0;
            outline-offset: 2px;
        }

        /* ジャンルのフォルダ */
        .folder {
            margin-bottom: 14px;
        }

        .folder-head {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-left: 5px solid #cbd5e0;
            border-radius: 10px;
            background: #fff;
            color: #2d3748;
            font: inherit;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
        }

        .folder-head .folder-name {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .folder-head .folder-count {
            color: #718096;
            font-size: 12px;
            font-weight: normal;
        }

        .folder-head .folder-chev {
            color: #718096;
            width: 1em;
            text-align: center;
        }

        .folder ons-list {
            margin-top: 6px;
        }

        /* メモ帳 */
        .note-body {
            min-height: 100%;
            box-sizing: border-box;
            padding: 14px;
            background: #fff;
            font-size: 17px;
            line-height: 1.7;
            outline: none;
            overflow-wrap: anywhere;
            -webkit-user-select: text;
            user-select: text;
        }

        .note-body img {
            display: block;
            max-width: 100%;
            margin: 8px 0;
            border-radius: 8px;
        }

        .note-title {
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .note-snippet {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #718096;
            font-size: 12px;
        }

        .help-content {
            padding: 18px;
            line-height: 1.8;
        }

        /* 追加ダイアログ */
        .dialog-body {
            padding: 18px;
            width: min(300px, calc(100vw - 72px));
            max-width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .dialog-body h3 {
            margin: 0 0 12px;
        }

        .dialog-body ons-input {
            width: 100%;
        }

        .form-options {
            margin: 14px 0 18px;
            padding: 12px;
            background: #f5f7fa;
            border-radius: 10px;
        }

        .range-heading {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .form-options ons-range {
            width: 100%;
        }

        .switch-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Firebaseログイン画面 */
        #authScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #f5f7fa;
        }

        #authCard {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            box-sizing: border-box;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .10);
        }

        #authCard h2 {
            margin: 0 0 8px;
            text-align: center;
        }

        #authCard p {
            color: #536273;
            line-height: 1.6;
        }

        #authCard label {
            display: block;
            margin: 14px 0 5px;
            font-size: 14px;
        }

        #authCard input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e0;
            border-radius: 7px;
            font-size: 16px;
        }

        #authCard button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #1e88e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #authCard button.secondary {
            background: #edf2f7;
            color: #2d3748;
        }

        #authMessage {
            min-height: 1.5em;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #accountBar {
            display: none;
            padding: 14px 16px;
            color: #2d3748;
            font-size: 13px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        /* ===== デザイン刷新：紙の手帳のような、静かで読みやすい見た目 ===== */
        :root {
            --paper: #f3f4ef;
            --surface: #ffffff;
            --ink: #1f2a37;
            --muted: #6b7683;
            --line: #dfe3da;
            --accent: #2f4b7c;
            --red: #d64545;
            --font-body: 'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', sans-serif;
            --font-title: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
        }

        body,
        ons-page,
        .page,
        ons-button,
        ons-list-item,
        button,
        input,
        textarea,
        select {
            font-family: var(--font-body);
        }

        body {
            background: var(--paper);
            color: var(--ink);
        }

        ons-page:not(#noteEditorPage) .page__background {
            background: var(--paper) !important;
        }

        /* 上のバーとタブ */
        .toolbar {
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            box-shadow: none;
        }

        .toolbar__center,
        .toolbar__title {
            font-family: var(--font-title);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--ink);
        }

        .toolbar-button,
        .back-button {
            color: var(--ink);
        }

        .tabbar {
            background: var(--paper);
            border-bottom: 1px solid var(--line);
        }

        .tabbar__label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        ons-tab[active] .tabbar__label {
            color: var(--ink);
            font-weight: 700;
        }

        .tabbar__border {
            background-color: var(--ink) !important;
            height: 2px;
        }

        .intro {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .summary {
            margin: 14px 0 10px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* リストは、細い線で囲んだ1枚ずつの札に */
        .list {
            margin: 0;
            border: none;
            background: transparent;
        }

        .list-item {
            margin: 0 0 8px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            overflow: hidden;
        }

        .list-item__left,
        .list-item__center,
        .list-item__right {
            border: none !important;
        }

        ons-splitter-side .list {
            padding: 10px 12px;
        }

        .todo-row {
            padding: 4px 0;
        }

        .todo-title {
            font-size: 15px;
            font-weight: 700;
        }

        .genre-chip {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font-weight: 500;
        }

        .genre-chip.active {
            border-color: transparent;
            color: #fff;
        }

        .folder-head {
            border: 1px solid var(--line);
            border-left: 6px solid var(--line);
            border-radius: 12px;
            font-family: var(--font-title);
            font-size: 15px;
            letter-spacing: 0.04em;
        }

        /* カレンダー */
        .cal-title {
            font-family: var(--font-title);
            font-size: 20px;
            letter-spacing: 0.08em;
        }

        .cal-weekday {
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
        }

        .cal-weekday.sun {
            color: var(--red);
        }

        .cal-weekday.sat {
            color: var(--accent);
        }

        .cal-day {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
        }

        .cal-day.sun .cal-num {
            color: var(--red);
        }

        .cal-day.sat .cal-num {
            color: var(--accent);
        }

        .cal-day.today .cal-num {
            background: var(--ink);
            color: #fff;
        }

        .cal-day.selected {
            outline: 2px solid var(--ink);
            outline-offset: -1px;
        }

        .cal-chip {
            border-radius: 4px;
            font-weight: 500;
        }

        .cal-day-heading {
            margin: 20px 0 8px;
            font-family: var(--font-title);
            font-size: 16px;
            letter-spacing: 0.04em;
        }

        /* 入力欄・ボタン・ダイアログ */
        .native-field {
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .native-field:focus {
            outline: none;
            border-color: var(--ink);
            box-shadow: 0 0 0 3px rgba(31, 42, 55, 0.12);
        }

        .button {
            border-radius: 10px;
            font-weight: 700;
        }

        /* ボタンの種類は modifier の指定で見分ける（iOS・Androidどちらでも同じ見た目に） */
        ons-button:not([modifier~="quiet"]):not([modifier~="light"]):not([modifier~="outline"]) {
            background-color: var(--ink);
            color: #fff;
        }

        ons-button[modifier~="quiet"] {
            background: transparent !important;
            color: var(--ink) !important;
        }

        ons-button[modifier~="light"] {
            border: 1px solid var(--line);
            background: var(--surface) !important;
            color: var(--ink) !important;
        }

        .fab {
            background-color: var(--accent) !important;
            box-shadow: 0 6px 18px rgba(47, 75, 124, 0.4);
        }

        .fab,
        .fab ons-icon,
        .fab .fab__icon {
            color: #fff !important;
        }

        .checkbox__input:checked+.checkbox__checkmark {
            background-color: var(--ink);
            border-color: var(--ink);
        }

        .dialog,
        .dialog-container {
            border-radius: 24px;
        }

        .dialog {
            box-shadow: 0 24px 60px rgba(31, 42, 55, 0.28);
        }

        .dialog-container {
            overflow: hidden;
            background: var(--surface);
        }

        .dialog-body h3 {
            font-family: var(--font-title);
            font-size: 19px;
            letter-spacing: 0.04em;
        }

        .form-options {
            border: 1px solid var(--line);
            background: var(--paper);
        }

        .help-content h2 {
            font-family: var(--font-title);
            letter-spacing: 0.04em;
        }

        /* ログイン画面 */
        #authScreen {
            background: var(--paper);
        }

        #authCard {
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(31, 42, 55, 0.12);
        }

        #authCard h2 {
            font-family: var(--font-title);
            font-size: 24px;
            letter-spacing: 0.08em;
        }

        #authCard input {
            border-radius: 10px;
        }

        #authCard button {
            border-radius: 10px;
            background: var(--ink);
            font-weight: 700;
        }

        #authCard button.secondary {
            border: 1px solid var(--line);
            background: var(--paper);
            color: var(--ink);
        }

        /* Android（Material）の表示に合わせた調整 */
        .fab {
            background-color: var(--accent) !important;
        }

        .fab,
        .fab ons-icon,
        .fab__icon {
            color: #fff !important;
        }

        .button--material--flat {
            background-color: transparent !important;
            color: var(--ink) !important;
            box-shadow: none;
        }
    </style>
</head>

<body>

    <!-- Firebaseログイン画面 -->
    <div id="authScreen">
        <div id="authCard">
            <h2>ToDoリスト</h2>
            <p>メールアドレスとパスワードで登録、またはログインしてください。</p>
            <label for="authEmail">メールアドレス</label>
            <input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com">
            <label for="authPassword">パスワード（6文字以上）</label>
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="パスワード">
            <button type="button" onclick="signInOrRegister('register')">新規登録</button>
            <button type="button" class="secondary" onclick="signInOrRegister('login')">ログイン</button>
            <p id="authMessage" role="status"></p>
        </div>
    </div>

    <!-- ons-splitter：左側メニューとメイン画面 -->
    <ons-splitter id="appSplitter">
        <ons-splitter-side id="sideMenu" side="left" width="260px" collapse>
            <ons-page>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtOhHCStSiKKuhNdHJhsCwpZAp_MCiMrg",
            authDomain: "my-todo-app-68448.firebaseapp.com",
            projectId: "my-todo-app-68448",
            storageBucket: "my-todo-app-68448.firebasestorage.app",
            messagingSenderId: "49497251580",
            appId: "1:49497251580:web:6ebcea283bd091e1990179",
            measurementId: "G-BFXJW7HPXS"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ---- Firestore同期の状態 ----
        let cloudReady = false;
        let cloudUser = null;
        let cloudUnsubscribe = null;
        let cloudWriteTimer = null;
        let applyingCloudData = false;
        let syncGeneration = 0;

        function showSyncError(message) {
            console.error(message);
            if (window.ons && ons.notification) {
                ons.notification.toast('クラウド同期に失敗しました。Firestoreのルールを確認してください。', { timeout: 3500 });
            }
        }

        function mergeById(cloudItems, localItems) {
            const result = Array.isArray(cloudItems) ? cloudItems.slice() : [];
            const seen = new Set(result.map(function (item) { return item && item.id; }).filter(Boolean));
            (Array.isArray(localItems) ? localItems : []).forEach(function (item) {
                if (item && item.id && !seen.has(item.id)) {
                    result.push(item);
                    seen.add(item.id);
                }
            });
            return result;
        }

        function localDataSnapshot() {
            return {
                tasks: tasks,
                genres: genres,
                memos: memos,
                notes: notes,
                noteFolders: noteFolders,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
        }

        function saveLocalData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            localStorage.setItem(GENRE_KEY, JSON.stringify(genres));
            localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
            localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
            localStorage.setItem(NFOLDER_KEY, JSON.stringify(noteFolders));
        }

        function scheduleCloudSave() {
            if (!cloudReady || !cloudUser || applyingCloudData) return;
            clearTimeout(cloudWriteTimer);
            cloudWriteTimer = setTimeout(async function () {
                try {
                    await db.collection('users').doc(cloudUser.uid).set(localDataSnapshot(), { merge: true });
                } catch (error) {
                    showSyncError('Firestore save failed: ' + error.code);
                }
            }, 250);
        }

        async function startCloudSync(user) {
            const thisGeneration = ++syncGeneration;
            cloudReady = false;
            cloudUser = user;
            if (cloudUnsubscribe) {
                cloudUnsubscribe();
                cloudUnsubscribe = null;
            }
            clearTimeout(cloudWriteTimer);
            if (!user) {
                cloudUser = null;
                return;
            }

            const docRef = db.collection('users').doc(user.uid);
            const migrationKey = 'onsenTodoCloudMigrated_' + user.uid;
            try {
                const doc = await docRef.get();
                if (thisGeneration !== syncGeneration || !auth.currentUser || auth.currentUser.uid !== user.uid) return;

                const localTasks = loadTasks();
                const localGenres = loadGenres();
                const localMemos = loadMemos();
                let data;

                if (doc.exists) {
                    const remote = doc.data() || {};
                    // 各端末のローカルデータは、端末ごとに一度だけクラウドへ統合する。
                    if (localStorage.getItem(migrationKey) !== '1') {
                        data = {
                            tasks: mergeById(remote.tasks, localTasks),
                            genres: mergeById(remote.genres, localGenres),
                            memos: mergeById(remote.memos, localMemos)
                        };
                        await docRef.set({
                            tasks: data.tasks,
                            genres: data.genres,
                            memos: data.memos,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                        localStorage.setItem(migrationKey, '1');
                    } else {
                        data = {
                            tasks: Array.isArray(remote.tasks) ? remote.tasks : [],
                            genres: Array.isArray(remote.genres) ? remote.genres : [],
                            memos: Array.isArray(remote.memos) ? remote.memos : []
                        };
                    }
                } else {
                    data = { tasks: localTasks, genres: localGenres, memos: localMemos };
                    await docRef.set({
                        tasks: data.tasks,
                        genres: data.genres,
                        memos: data.memos,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    localStorage.setItem(migrationKey, '1');
                }

                if (thisGeneration !== syncGeneration) return;
                applyingCloudData = true;
                tasks = Array.isArray(data.tasks) ? data.tasks : [];
                genres = Array.isArray(data.genres) ? data.genres : [];
                memos = Array.isArray(data.memos) ? data.memos : [];
                applyRemoteNotes(doc.exists ? doc.data() : null);
                saveLocalData();
                renderTasks();
                applyingCloudData = false;
                cloudReady = true;
                if (notesNeedUpload) { notesNeedUpload = false; scheduleCloudSave(); }

                cloudUnsubscribe = docRef.onSnapshot(function (snapshot) {
                    if (!snapshot.exists || thisGeneration !== syncGeneration) return;
                    const remote = snapshot.data() || {};
                    applyingCloudData = true;
                    tasks = Array.isArray(remote.tasks) ? remote.tasks : [];
                    genres = Array.isArray(remote.genres) ? remote.genres : [];
                    memos = Array.isArray(remote.memos) ? remote.memos : [];
                    applyRemoteNotes(remote);
                    try { saveLocalData(); } catch (e) { console.error('Local save failed', e); }
                    renderTasks();
                    applyingCloudData = false;
                    cloudReady = true;
                }, function (error) {
                    cloudReady = false;
                    showSyncError('Firestore listener failed: ' + error.code);
                });
            } catch (error) {
                applyingCloudData = false;
                cloudReady = false;
                showSyncError('Firestore sync failed: ' + error.code);
            }
        }

        // ---- Firebaseメールアドレス認証 ----
        function setAuthMessage(message) {
            document.getElementById('authMessage').textContent = message;
        }

        async function signInOrRegister(mode) {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                setAuthMessage('メールアドレスとパスワードを入力してください。');
                return;
            }
            if (mode === 'register' && password.length < 6) {
                setAuthMessage('パスワードは6文字以上にしてください。');
                return;
            }

            setAuthMessage('処理中です…');
            try {
                if (mode === 'register') {
                    await auth.createUserWithEmailAndPassword(email, password);
                    setAuthMessage('登録しました。');
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    setAuthMessage('ログインしました。');
                }
            } catch (error) {
                let message = '処理できませんでした。入力内容とFirebaseの設定を確認してください。';
                if (error.code === 'auth/email-already-in-use') {
                    message = 'このメールアドレスは登録済みです。ログインを試してください。';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'メールアドレスの形式を確認してください。';
                } else if (error.code === 'auth/weak-password') {
                    message = 'パスワードは6文字以上にしてください。';
                } else if (error.code === 'auth/invalid-credential' ||
                    error.code === 'auth/wrong-password' ||
                    error.code === 'auth/user-not-found') {
                    message = 'メールアドレスまたはパスワードを確認してください。';
                } else if (error.code === 'auth/operation-not-allowed') {
                    message = 'Firebase Consoleでメール/パスワード認証を有効にしてください。';
                } else if (error.code === 'auth/network-request-failed') {
                    message = '通信に失敗しました。ネットワークを確認してください。';
                }
                setAuthMessage(message);
                console.error('Firebase Authentication error:', error.code);
            }
        }

        async function signOutUser() {
            try {
                await auth.signOut();
            } catch (error) {
                ons.notification.alert('ログアウトできませんでした。通信状態を確認してください。');
            }
        }

        auth.onAuthStateChanged(function (user) {
            const screen = document.getElementById('authScreen');
            const accountBar = document.getElementById('accountBar');
            if (user) {
                screen.style.display = 'none';
                accountBar.style.display = 'block';
                document.getElementById('signedInEmail').textContent = user.email || 'ログイン中';
                startCloudSync(user);
            } else {
                screen.style.display = 'flex';
                accountBar.style.display = 'none';
                document.getElementById('signedInEmail').textContent = '';
                startCloudSync(null);
            }
        });

        const STORAGE_KEY = 'onsenTodoTasks';

        // ---- 保存データの読み込み（壊れていても起動できるようにする）----
        function newId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function loadTasks() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!Array.isArray(saved)) return [];
                return saved
                    .filter(function (t) {
                        return t && typeof t.text === 'string' && t.text !== '';
                    })
                    .map(function (t) {
                        const p = Number(t.priority);
                        return {
                            id: typeof t.id === 'string' ? t.id : newId(), // 旧データにはIDを付与
                            text: t.text,
                            completed: Boolean(t.completed),
                            priority: p >= 1 && p <= 5 ? p : 3,
                            important: Boolean(t.important),
                            memo: typeof t.memo === 'string' ? t.memo : '',
                            genre: typeof t.genre === 'string' ? t.genre : '',
                            due: /^\d{4}-\d{2}-\d{2}$/.test(t.due) ? t.due : '',
                            time: /^\d{2}:\d{2}$/.test(t.time) ? t.time : '',
                            endTime: /^\d{2}:\d{2}$/.test(t.endTime) ? t.endTime : '',
                            repeat: ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : '',
                            spawned: Boolean(t.spawned),

                    });
            } catch (e) {

        // ---- ジャンル（色分け）----

        let currentGenre = 'all'; // 'all'（すべて）/ 'none'（未分類）/ ジャンルID

        let draftColor = GENRE_COLORS[5];

        // ジャンルのボタン（絞り込み用・追加ダイアログ用で共通）

            if (!g) return;
            ons.notification.confirm(
                '「' + g.name + '」を削除しますか？ このジャンルのタスクは「未分類」になります。',
                { buttonLabels: ['キャンセル', '削除'] }

        // タスクのジャンルを付け替える（ジャンル名をタップ）

        // ---- メモ（箇条書き）----
        const MEMO_KEY = 'onsenTodoMemos';

        function loadMemos() {
            try {
                const saved = JSON.parse(localStorage.getItem(MEMO_KEY));
                if (!Array.isArray(saved)) return [];
                return saved
                    .filter(function (m) { return m && typeof m.text === 'string' && m.text !== ''; })
                    .map(function (m) {

        let memos = loadMemos();

        function addMemo() {

        function renderMemos() {
            const list = document.getElementById('memoList');
            const empty = document.getElementById('memoEmpty');
            if (!list || !empty) return; // ページ未生成のときは何もしない

            list.replaceChildren();

                empty.textContent = 'メモはまだありません。';

                    }).then(function (value) {

                del.setAttribute('modifier', 'quiet');

        // ---- メモ帳（フォルダ・自由記述・写真）----
        const NOTE_KEY = 'onsenTodoNotes';
        const NFOLDER_KEY = 'onsenTodoNoteFolders';
        const NOTE_LIMIT = 800000; // Firestoreの1ドキュメント(約1MB)に収めるための目安（文字数）
        let notesNeedUpload = false;
        let noteFolderId = null; // 開いているフォルダ（nullならフォルダ一覧）

        // 本文HTMLから、文字・改行・画像(data URL)以外をすべて取り除く
        function sanitizeNoteHtml(html) {
            const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
            const out = document.createElement('div');
            (function walk(src, dst) {
                src.childNodes.forEach(function (n) {
                    if (n.nodeType === 3) {
                        dst.appendChild(document.createTextNode(n.nodeValue));
                    } else if (n.nodeType === 1) {
                        const tag = n.tagName.toLowerCase();
                        if (tag === 'img') {
                            const s = n.getAttribute('src') || '';
                            if (/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s)) {
                                const im = document.createElement('img');
                                im.src = s;
                                dst.appendChild(im);
                            }
                        } else if (tag === 'br') {
                            dst.appendChild(document.createElement('br'));
                        } else if (tag === 'div' || tag === 'p') {
                            const d = document.createElement('div');
                            walk(n, d);
                            dst.appendChild(d);
                        } else if (tag !== 'script' && tag !== 'style') {
                            walk(n, dst);
                        }
                    }
                });
            })(doc.body, out);
            return out.innerHTML;
        }

        function noteMeta(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html.replace(/<img[^>]*>/g, '').replace(/<br\s*\/?>|<\/div>|<div>/g, '\n');
            const lines = tmp.textContent.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
            const photo = /<img/.test(html);
            return {
                title: lines[0] || (photo ? '📷 写真' : '新規メモ'),
                snippet: lines[1] || (lines[0] && photo ? '📷 写真' : ''),
                empty: lines.length === 0 && !photo
            };
        }

        function normFolders(list) {
            return (Array.isArray(list) ? list : []).filter(function (f) {
                return f && typeof f.id === 'string' && typeof f.name === 'string' && f.name !== '';
            }).map(function (f) { return { id: f.id, name: f.name }; });
        }

        function normNotes(list) {
            return (Array.isArray(list) ? list : []).filter(function (n) {
                return n && typeof n.id === 'string' && typeof n.folder === 'string';
            }).map(function (n) {
                const html = sanitizeNoteHtml(n.html);
                const meta = noteMeta(html);
                return { id: n.id, folder: n.folder, html: html, title: meta.title, snippet: meta.snippet, updated: Number(n.updated) || 0 };
            });
        }

        function readJsonList(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return []; }
        }

        let noteFolders = normFolders(readJsonList(NFOLDER_KEY));
        let notes = normNotes(readJsonList(NOTE_KEY));

        // 初回：フォルダを1つ作り、これまでの箇条書きメモがあれば1つのメモにまとめる
        if (noteFolders.length === 0 && notes.length === 0) {
            const first = { id: newId(), name: 'メモ' };
            noteFolders.push(first);
            if (memos.length > 0) {
                const html = memos.map(function (m) {
                    const d = document.createElement('div');
                    d.textContent = '・' + m.text;
                    return '<div>' + d.innerHTML + '</div>';
                }).join('');
                const meta = noteMeta(html);
                notes.push({ id: newId(), folder: first.id, html: html, title: meta.title, snippet: meta.snippet, updated: Date.now() });
            }
            try {
                localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
                localStorage.setItem(NFOLDER_KEY, JSON.stringify(noteFolders));
            } catch (e) { /* 次の保存で再試行される */ }
        }

        function saveNotes() {
            try {
                localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
                localStorage.setItem(NFOLDER_KEY, JSON.stringify(noteFolders));
                scheduleCloudSave();
            } catch (e) {
                ons.notification.toast('保存できませんでした（容量がいっぱいかもしれません）', { timeout: 2500 });
            }
        }

        // クラウドのデータを反映（クラウドにメモ帳がまだ無ければ、この端末のものを送る）
        function applyRemoteNotes(remote) {
            if (remote && Array.isArray(remote.notes) && Array.isArray(remote.noteFolders)) {
                noteFolders = normFolders(remote.noteFolders);
                notes = normNotes(remote.notes);
            } else if (notes.length > 0 || noteFolders.length > 0) {
                notesNeedUpload = true;
            }
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function mkButton(label, modifier, onClick) {
            const b = document.createElement('ons-button');
            if (modifier) b.setAttribute('modifier', modifier);
            b.textContent = label;
            b.addEventListener('click', onClick);
            return b;
        }

        function fmtNoteDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toDateString() === new Date().toDateString()
                ? pad(d.getHours()) + ':' + pad(d.getMinutes())
                : (d.getMonth() + 1) + '/' + d.getDate();
        }

        function renderNotes() {
            const area = document.getElementById('noteArea');
            if (!area) return; // ページ未生成のときは何もしない
            area.replaceChildren();
            const folder = noteFolders.find(function (f) { return f.id === noteFolderId; });

            if (!folder) {
                noteFolderId = null;
                const head = el('div', 'cal-header');
                head.append(el('span', 'cal-title', 'フォルダ'), mkButton('＋ フォルダ', '', addNoteFolder));
                area.appendChild(head);
                if (noteFolders.length === 0) {
                    area.appendChild(el('div', 'empty-message', 'フォルダはまだありません。「＋ フォルダ」から作れます。'));
                    return;
                }
                const list = document.createElement('ons-list');
                noteFolders.forEach(function (f) {
                    const item = document.createElement('ons-list-item');
                    const row = el('div', 'todo-row');
                    const count = notes.filter(function (n) { return n.folder === f.id; }).length;
                    item.setAttribute('tappable', '');
                    row.append(el('span', '', '📁'), el('div', 'todo-text', f.name), el('small', '', count + '件 ›'));
                    item.appendChild(row);
                    item.addEventListener('click', function () { noteFolderId = f.id; renderNotes(); });
                    list.appendChild(item);
                });
                area.appendChild(list);
                return;
            }

            const head = el('div', 'cal-header');
            head.append(
                mkButton('‹ フォルダ', 'quiet', function () { noteFolderId = null; renderNotes(); }),
                el('span', 'cal-title', folder.name),
                mkButton('名前', 'quiet', function () { renameNoteFolder(folder); }),
                mkButton('削除', 'quiet', function () { deleteNoteFolder(folder); })
            );
            area.appendChild(head);
            const add = mkButton('＋ 新規メモ', 'large', function () { newNote(folder.id); });
            add.style.marginBottom = '12px';
            area.appendChild(add);

            const mine = notes.filter(function (n) { return n.folder === folder.id; })
                .sort(function (a, b) { return b.updated - a.updated; });
            if (mine.length === 0) {
                area.appendChild(el('div', 'empty-message', 'このフォルダにメモはありません。'));
                return;
            }
            const list = document.createElement('ons-list');
            mine.forEach(function (n) {
                const item = document.createElement('ons-list-item');
                const row = el('div', 'todo-row');
                const text = el('div', 'todo-text');
                item.setAttribute('tappable', '');
                text.append(el('div', 'note-title', n.title), el('small', 'note-snippet', n.snippet));
                row.append(text, el('small', '', fmtNoteDate(n.updated)));
                item.appendChild(row);
                item.addEventListener('click', function () { openNote(n.id); });
                list.appendChild(item);
            });
            area.appendChild(list);
        }

        function addNoteFolder() {
            ons.notification.prompt('フォルダの名前', { buttonLabels: ['キャンセル', '作成'] }).then(function (v) {
                const name = v === null ? '' : v.trim().slice(0, 30);
                if (name === '') return;
                noteFolders.push({ id: newId(), name: name });
                saveNotes();
                renderNotes();
            });
        }

        function renameNoteFolder(folder) {
            ons.notification.prompt('フォルダ名を変更', { defaultValue: folder.name, buttonLabels: ['キャンセル', 'OK'] }).then(function (v) {
                const name = v === null ? '' : v.trim().slice(0, 30);
                if (name === '') return;
                folder.name = name;
                saveNotes();
                renderNotes();
            });
        }

        function deleteNoteFolder(folder) {
            const count = notes.filter(function (n) { return n.folder === folder.id; }).length;
            ons.notification.confirm(
                '「' + folder.name + '」を削除しますか？' + (count > 0 ? ' 中のメモ' + count + '件も一緒に消えます。' : ''),
                { buttonLabels: ['キャンセル', '削除'] }
            ).then(function (index) {
                if (index !== 1) return;
                noteFolders = noteFolders.filter(function (f) { return f.id !== folder.id; });
                notes = notes.filter(function (n) { return n.folder !== folder.id; });
                noteFolderId = null;
                saveNotes();
                renderNotes();
            });
        }

        function openNote(id) {
            document.getElementById('navigator').pushPage('note.html', { data: { id: id } });
        }

        function newNote(folderId) {
            const note = { id: newId(), folder: folderId, html: '', title: '新規メモ', snippet: '', updated: Date.now() };
            notes.push(note);
            saveNotes();
            openNote(note.id);
        }

        // 編集中の本文を保存する
        function commitNote(id, body) {
            const note = notes.find(function (n) { return n.id === id; });
            if (!note) return;
            const html = sanitizeNoteHtml(body.innerHTML);
            if (html === note.html) return;
            const meta = noteMeta(html);
            note.html = html;
            note.title = meta.title;
            note.snippet = meta.snippet;
            note.updated = Date.now();
            saveNotes();
            renderNotes();
        }

        // 写真を小さく圧縮する（長辺700px・JPEG）
        function compressImage(file) {
            return new Promise(function (resolve, reject) {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = function () {
                    const scale = Math.min(1, 700 / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.max(1, Math.round(img.width * scale));
                    c.height = Math.max(1, Math.round(img.height * scale));
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/jpeg', 0.6));
                };
                img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
                img.src = url;
            });
        }

        function insertPhoto(body, file) {
            compressImage(file).then(function (dataUrl) {
                if (JSON.stringify(notes).length + dataUrl.length > NOTE_LIMIT) {
                    ons.notification.toast('メモの容量がいっぱいです。古い写真を消してから入れてください', { timeout: 3000 });
                    return;
                }
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && body.contains(sel.anchorNode)) {
                    document.execCommand('insertHTML', false, '<img src="' + dataUrl + '"><br>');
                } else {
                    const im = document.createElement('img');
                    im.src = dataUrl;
                    body.append(im, document.createElement('br'));
                }
                body.dispatchEvent(new Event('input'));
            }).catch(function () {
                ons.notification.toast('写真を読み込めませんでした', { timeout: 2000 });
            });
        }

        // メモの編集画面ができたときの準備
        document.addEventListener('init', function (e) {
            const page = e.target;
            if (!page || page.id !== 'noteEditorPage') return;
            const id = page.data && page.data.id;
            const note = notes.find(function (n) { return n.id === id; });
            if (!note) { document.getElementById('navigator').popPage(); return; }

            const body = page.querySelector('#noteBody');
            const fileInput = page.querySelector('#notePhotoInput');
            let timer = null;
            function flush() { clearTimeout(timer); timer = null; commitNote(id, body); }

            body.innerHTML = note.html;
            body.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(flush, 400); });
            body.addEventListener('paste', function (ev) {
                const cd = ev.clipboardData;
                if (!cd) return;
                ev.preventDefault(); // 書式は持ち込まず、文字と画像だけ受け取る
                const files = Array.from(cd.files || []).filter(function (f) { return /^image\//.test(f.type); });
                if (files.length > 0) { files.forEach(function (f) { insertPhoto(body, f); }); return; }
                const text = cd.getData('text/plain');
                if (text) document.execCommand('insertText', false, text);
            });
            body.addEventListener('click', function (ev) {
                if (ev.target && ev.target.tagName === 'IMG') {
                    const img = ev.target;
                    ons.notification.confirm('この写真を削除しますか？', { buttonLabels: ['キャンセル', '削除'] }).then(function (index) {
                        if (index !== 1) return;
                        img.remove();
                        body.dispatchEvent(new Event('input'));
                    });
                }
            });
            page.addEventListener('hide', flush);

            page.querySelector('#notePhotoBtn').addEventListener('click', function () { fileInput.click(); });
            fileInput.addEventListener('change', function () {
                Array.from(fileInput.files || []).forEach(function (f) { insertPhoto(body, f); });
                fileInput.value = '';
            });
            page.querySelector('#noteMoveBtn').addEventListener('click', function () {
                flush();
                ons.openActionSheet({
                    title: 'フォルダを選ぶ',
                    cancelable: true,
                    buttons: noteFolders.map(function (f) { return f.name; })
                        .concat([{ label: 'キャンセル', icon: 'md-close' }])
                }).then(function (index) {
                    if (index < 0 || index >= noteFolders.length) return;
                    const target = notes.find(function (n) { return n.id === id; });
                    if (!target) return;
                    target.folder = noteFolders[index].id;
                    noteFolderId = target.folder;
                    saveNotes();
                    renderNotes();
                });
            });
            page.querySelector('#noteDelBtn').addEventListener('click', function () {
                ons.notification.confirm('このメモを削除しますか？', { buttonLabels: ['キャンセル', '削除'] }).then(function (index) {
                    if (index !== 1) return;
                    notes = notes.filter(function (n) { return n.id !== id; });
                    saveNotes();
                    renderNotes();
                    document.getElementById('navigator').popPage();
                });
            });
            if (note.html === '') body.focus();
        });

        // 何も書かずに閉じたメモは残さない
        document.addEventListener('destroy', function (e) {
