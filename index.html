<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDoリスト</title>
    <!-- バージョンを固定して、将来の更新で壊れないようにする -->
    <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.8/css/onsenui.css">
    <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.8/css/onsen-css-components.min.css">
    <script src="https://unpkg.com/onsenui@2.12.8/js/onsenui.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script>
    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: #f5f7fa;
        }

        /* タブが5つ並んでも収まるように */
        .tabbar__label {
            font-size: 12px;
        }

        .page-content {
            padding: 12px 12px 88px;
            /* 下側は追加ボタン(FAB)に隠れない余白 */
        }

        .intro {
            margin: 8px 0 12px;
            color: #536273;
        }

        .summary {
            margin: 12px 0;
            color: #536273;
            font-size: 14px;
        }

        .todo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .todo-text {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .todo-title.completed {
            color: #89939d;
            text-decoration: line-through;
        }

        .todo-title.important {
            font-weight: bold;
        }

        .important-mark {
            color: #e53935;
        }


        /* カレンダー */
        .cal-header {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .cal-title {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 2px;
        }

        .cal-weekday {
            padding: 4px 0;
            text-align: center;
            color: #718096;
            font-size: 12px;
        }

        .cal-weekday.sun {
            color: #e53935;
        }

        .cal-weekday.sat {
            color: #1e88e5;
        }

        .cal-blank {
            min-height: 44px;
        }

        .cal-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            min-width: 0;
            min-height: 44px;
            padding: 2px 0;
            border: none;
            border-radius: 8px;
            background: #fff;
            font: inherit;
            cursor: pointer;
        }

        .cal-day.sun .cal-num {
            color: #e53935;
        }

        .cal-day.sat .cal-num {
            color: #1e88e5;
        }

        .cal-day.today .cal-num {
            background: #1e88e5;
            color: #fff;
        }

        .cal-day.selected {
            outline: 2px solid #1e88e5;
        }

        .cal-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            line-height: 22px;
            text-align: center;
            font-size: 13px;
        }

        .cal-mark {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #536273;
            font-size: 10px;
        }

        .cal-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1e88e5;
        }

        .cal-dot.done {
            background: #a0aec0;
        }

        .cal-dot.overdue {
            background: #e53935;
        }

        .cal-day-heading {
            margin: 18px 0 4px;
            font-size: 15px;
            color: #2d3748;
        }

        .task-due.overdue {
            color: #e53935;
            font-weight: bold;
        }

        .task-memo {
            margin-top: 4px;
            color: #4a5568;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .todo-row {
            gap: 8px;
        }

        .todo-row ons-button {
            padding: 0 6px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .field-label {
            display: block;
            margin: 12px 0 4px;
            color: #536273;
            font-size: 13px;
        }

        .dialog-body input,
        .dialog-body textarea {
            font-size: 16px;
            /* 16px未満だとiPhoneで入力時に画面が拡大される */
        }

        .native-field {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 8px;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
            min-height: 38px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: #fff;
        }

        .date-row {
            display: flex;
            gap: 6px;
        }

        .date-row .native-field {
            flex: 1;
            min-width: 0;
        }

        .task-details {
            display: block;
            margin-top: 3px;
            color: #718096;
            font-size: 12px;
        }

        .empty-message {
            padding: 24px 12px;
            color: #718096;
            text-align: center;
        }

        /* メモ（箇条書き） */
        .memo-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .memo-input-row .native-field {
            flex: 1;
            font-size: 16px;
        }

        .memo-bullet {
            color: #536273;
            font-weight: bold;
        }

        .memo-text {
            cursor: pointer;
        }

        /* ジャンル（色分け） */
        .genre-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 4px 0 12px;
        }

        .genre-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 999px;
            background: #fff;
            color: #2d3748;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .genre-chip.active {
            border-color: transparent;
            color: #fff;
        }

        .genre-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .genre-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding: 1px 8px;
            border: none;
            border-radius: 999px;
            background: #edf2f7;
            color: #4a5568;
            font: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        .genre-tag .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .genre-row-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            margin: 12px 0 18px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            padding: 0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .color-swatch.selected {
            outline: 3px solid #a0aec0;
            outline-offset: 2px;
        }

        .help-content {
            padding: 18px;
            line-height: 1.8;
        }

        /* 追加ダイアログ */
        .dialog-body {
            padding: 18px;
            width: min(300px, calc(100vw - 72px));
            max-width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .dialog-body h3 {
            margin: 0 0 12px;
        }

        .dialog-body ons-input {
            width: 100%;
        }

        .form-options {
            margin: 14px 0 18px;
            padding: 12px;
            background: #f5f7fa;
            border-radius: 10px;
        }

        .range-heading {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .form-options ons-range {
            width: 100%;
        }

        .switch-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Firebaseログイン画面 */
        #authScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #f5f7fa;
        }
        #authCard {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            box-sizing: border-box;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,.10);
        }
        #authCard h2 { margin: 0 0 8px; text-align: center; }
        #authCard p { color: #536273; line-height: 1.6; }
        #authCard label { display: block; margin: 14px 0 5px; font-size: 14px; }
        #authCard input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e0;
            border-radius: 7px;
            font-size: 16px;
        }
        #authCard button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #1e88e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        #authCard button.secondary {
            background: #edf2f7;
            color: #2d3748;
        }
        #authMessage { min-height: 1.5em; font-size: 13px; overflow-wrap: anywhere; }
        #accountBar {
            display: none;
            padding: 6px 12px;
            background: #edf2f7;
            color: #2d3748;
            font-size: 12px;
            text-align: right;
        }
    </style>
</head>

<body>

    <!-- Firebaseログイン画面 -->
    <div id="authScreen">
        <div id="authCard">
            <h2>ToDoリスト</h2>
            <p>メールアドレスとパスワードで登録、またはログインしてください。</p>
            <label for="authEmail">メールアドレス</label>
            <input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com">
            <label for="authPassword">パスワード（6文字以上）</label>
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="パスワード">
            <button type="button" onclick="signInOrRegister('register')">新規登録</button>
            <button type="button" class="secondary" onclick="signInOrRegister('login')">ログイン</button>
            <p id="authMessage" role="status"></p>
        </div>
    </div>
    <div id="accountBar">
        <span id="signedInEmail"></span>
        <button type="button" onclick="signOutUser()" style="width:auto;margin:0 0 0 8px;padding:5px 10px;">ログアウト</button>
    </div>

    <!-- ons-splitter：左側メニューとメイン画面 -->
    <ons-splitter id="appSplitter">
        <ons-splitter-side id="sideMenu" side="left" width="260px" collapse swipeable>
            <ons-page>
                <ons-toolbar>
                    <div class="center">メニュー</div>
                </ons-toolbar>
                <ons-list>
                    <ons-list-item tappable onclick="openGenres()">ジャンルの管理</ons-list-item>
                    <ons-list-item tappable onclick="openHelp()">使い方</ons-list-item>
                    <ons-list-item tappable onclick="closeMenu()">メニューを閉じる</ons-list-item>
                </ons-list>
            </ons-page>
        </ons-splitter-side>
        <ons-splitter-content>
            <ons-navigator id="navigator" page="home.html"></ons-navigator>
        </ons-splitter-content>
    </ons-splitter>

    <!-- タスク追加ダイアログ（入力フォームはここ1か所だけ） -->
    <ons-dialog id="addDialog" cancelable>
        <div class="dialog-body">
            <h3>新しいタスク</h3>
            <ons-input id="taskInput" type="text" modifier="underbar" placeholder="タスクを入力" float></ons-input>
            <label class="field-label" for="taskMemo">メモ（任意）</label>
            <textarea id="taskMemo" class="native-field" rows="3" placeholder="詳細や持ち物など"></textarea>
            <label class="field-label" for="taskDue">期限（任意）</label>
            <div class="date-row">
                <input id="taskDue" class="native-field" type="date" aria-label="期限の日付">
                <input id="taskTime" class="native-field" type="time" aria-label="期限の時刻（任意）">
            </div>
            <span class="field-label">ジャンル</span>
            <div id="addGenreBar" class="genre-bar"></div>
            <div class="form-options">
                <div class="range-heading">
                    <span>優先度</span>
                    <span><span id="priorityValue">3</span> / 5</span>
                </div>
                <ons-range id="priority" min="1" max="5" step="1" value="3" oninput="updatePriority()"></ons-range>
                <label class="switch-row">
                    <ons-switch id="important"></ons-switch>
                    <span>重要タスクにする</span>
                </label>
            </div>
            <div class="dialog-actions">
                <ons-button modifier="quiet" onclick="closeAddDialog()">キャンセル</ons-button>
                <ons-button onclick="addTask()">追加</ons-button>
            </div>
        </div>
    </ons-dialog>

    <!-- ジャンルの追加・編集ダイアログ -->
    <ons-dialog id="genreDialog" cancelable>
        <div class="dialog-body">
            <h3 id="genreDialogTitle">新しいジャンル</h3>
            <input id="genreName" class="native-field" type="text" maxlength="20" placeholder="ジャンル名（例：仕事）">
            <span class="field-label">色</span>
            <div id="genrePalette" class="swatch-grid"></div>
            <div class="dialog-actions">
                <ons-button id="genreDeleteBtn" modifier="quiet" onclick="deleteGenre()">削除</ons-button>
                <ons-button modifier="quiet" onclick="closeGenreDialog()">キャンセル</ons-button>
                <ons-button onclick="saveGenre()">保存</ons-button>
            </div>
        </div>
    </ons-dialog>

    <!-- メイン画面 -->
    <template id="home.html">
        <ons-page>
            <ons-toolbar>
                <div class="left">
                    <ons-toolbar-button onclick="openMenu()" aria-label="メニュー">
                        <ons-icon icon="md-menu"></ons-icon>
                    </ons-toolbar-button>
                </div>
                <div class="center">ToDoリスト</div>
            </ons-toolbar>

            <!-- ons-tabbar：タスク表示を切り替える -->
            <ons-tabbar id="filterTabs" position="top" swipeable>
                <ons-tab label="Today" page="tab-all.html" active></ons-tab>
                <ons-tab label="ToDo" page="tab-open.html"></ons-tab>
                <ons-tab label="完了" page="tab-done.html"></ons-tab>
                <ons-tab label="カレンダー" page="tab-calendar.html"></ons-tab>
                <ons-tab label="メモ" page="tab-memo.html"></ons-tab>
            </ons-tabbar>

            <!-- タスク追加ボタン（メモタブでは隠す） -->
            <ons-fab id="addFab" position="bottom right" onclick="openAddDialog()" aria-label="タスクを追加">
                <ons-icon icon="md-plus"></ons-icon>
            </ons-fab>
        </ons-page>
    </template>

    <!-- すべてのタスク -->
    <template id="tab-all.html">
        <ons-page>
            <div class="page-content">
                <p class="intro">今日が期限のタスクです。終わったらチェックしましょう。</p>
                <div class="genre-bar" data-genre-filter></div>
                <div id="summaryAll" class="summary"></div>
                <ons-list id="allList"></ons-list>
                <div id="allEmpty" class="empty-message" hidden></div>
            </div>
        </ons-page>
    </template>

    <!-- 未完了のタスク -->
    <template id="tab-open.html">
        <ons-page>
            <div class="page-content">
                <p class="intro">これからやるタスクです。チェックを入れると「完了」に移ります。</p>
                <div class="genre-bar" data-genre-filter></div>
                <div id="summaryOpen" class="summary"></div>
                <ons-list id="openList"></ons-list>
                <div id="openEmpty" class="empty-message" hidden></div>
            </div>
        </ons-page>
    </template>

    <!-- 完了したタスク -->
    <template id="tab-done.html">
        <ons-page>
            <div class="page-content">
                <p class="intro">完了したタスクです。チェックを外すと「ToDo」に戻ります。</p>
                <div class="genre-bar" data-genre-filter></div>
                <div id="summaryDone" class="summary"></div>
                <ons-list id="doneList"></ons-list>
                <div id="doneEmpty" class="empty-message" hidden></div>
            </div>
        </ons-page>
    </template>

    <!-- カレンダー（月表示） -->
    <template id="tab-calendar.html">
        <ons-page>
            <div class="page-content">
                <div class="genre-bar" data-genre-filter></div>
                <div class="cal-header">
                    <ons-button modifier="quiet" onclick="changeMonth(-1)" aria-label="前の月">
                        <ons-icon icon="md-chevron-left"></ons-icon>
                    </ons-button>
                    <span id="calTitle" class="cal-title"></span>
                    <ons-button modifier="quiet" onclick="changeMonth(1)" aria-label="次の月">
                        <ons-icon icon="md-chevron-right"></ons-icon>
                    </ons-button>
                    <ons-button modifier="light" onclick="goToday()">今日</ons-button>
                </div>
                <div id="calGrid" class="cal-grid"></div>
                <h3 id="calDayHeading" class="cal-day-heading"></h3>
                <ons-list id="calDayList"></ons-list>
                <div id="calDayEmpty" class="empty-message" hidden></div>
            </div>
        </ons-page>
    </template>

    <!-- メモ（箇条書き） -->
    <template id="tab-memo.html">
        <ons-page>
            <div class="page-content">
                <p class="intro">思いついたことを箇条書きでメモできます。文をタップすると編集できます。</p>
                <div class="memo-input-row">
                    <input id="memoInput" class="native-field" type="text" placeholder="メモを入力（Enterで追加）"
                        onkeydown="if (event.key === 'Enter' && !event.isComposing) addMemo()">
                    <ons-button onclick="addMemo()">追加</ons-button>
                </div>
                <ons-list id="memoList"></ons-list>
                <div id="memoEmpty" class="empty-message" hidden></div>
            </div>
        </ons-page>
    </template>

    <!-- ジャンルの管理 -->
    <template id="genres.html">
        <ons-page>
            <ons-toolbar>
                <div class="left"><ons-back-button>戻る</ons-back-button></div>
                <div class="center">ジャンルの管理</div>
            </ons-toolbar>
            <div class="page-content">
                <p class="intro">「編集」で名前や色を変更、「削除」でジャンルを消せます。</p>
                <ons-list id="genreList"></ons-list>
                <div id="genreEmpty" class="empty-message" hidden></div>
                <ons-button modifier="large" onclick="openGenreDialog()" style="margin-top: 16px">＋ ジャンルを追加</ons-button>
            </div>
        </ons-page>
    </template>

    <!-- ons-back-button：使い方ページから戻る -->
    <template id="help.html">
        <ons-page>
            <ons-toolbar>
                <div class="left"><ons-back-button>戻る</ons-back-button></div>
                <div class="center">使い方</div>
            </ons-toolbar>
            <div class="help-content">
                <h2>ToDoリストの使い方</h2>
                <ol>
                    <li>右下の「＋」ボタンを押します。</li>
                    <li>タスクを書き、必要ならメモと期限（日付・時刻）を入れ、優先度を選びます。重要なタスクはスイッチをONにします。</li>
                    <li>「追加」を押す（またはEnterキー）と登録されます。</li>
                    <li>終わったタスクはチェックを入れます。</li>
                    <li>タブで「Today」「ToDo」「完了」「カレンダー」「メモ」を切り替えます。「Today」には期限が今日のタスクだけが表示されます。ToDoタブでチェックを入れると、そのタスクは消えて「完了」タブに移ります。
                    </li>
                    <li>ジャンル（仕事・買い物など）は、名前を自分で入力し、10色から色を選んで作れます。画面上部やタスク追加画面の「＋」、またはメニューの「ジャンルの管理」から追加できます（名前・色の変更や削除は、上部の「✎
                        編集」かメニューの「ジャンルの管理」で行えます）。上部のボタンで絞り込め、タスクのジャンル名をタップすると付け替えられます。</li>
                    <li>カレンダーでは、期限があるタスクの日に印が付きます。日付を押すと、その日のタスクが下に表示されます（印の青は未完了、赤は期限切れ、灰色は完了済み）。</li>
                    <li>「メモ」タブでは、箇条書きのメモを自由に追加できます。文をタップすると編集、「削除」で消せます。</li>
                    <li>不要なタスクは「削除」を押します。</li>
                </ol>
                <p>重要なタスクは上に、同じ重要度なら優先度の高い順に並びます。</p>
            </div>
        </ons-page>
    </template>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtOhHCStSiKKuhNdHJhsCwpZAp_MCiMrg",
            authDomain: "my-todo-app-68448.firebaseapp.com",
            projectId: "my-todo-app-68448",
            storageBucket: "my-todo-app-68448.firebasestorage.app",
            messagingSenderId: "49497251580",
            appId: "1:49497251580:web:6ebcea283bd091e1990179",
            measurementId: "G-BFXJW7HPXS"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ---- Firestore同期の状態 ----
        let cloudReady = false;
        let cloudUser = null;
        let cloudUnsubscribe = null;
        let cloudWriteTimer = null;
        let applyingCloudData = false;
        let syncGeneration = 0;

        function showSyncError(message) {
            console.error(message);
            if (window.ons && ons.notification) {
                ons.notification.toast('クラウド同期に失敗しました。Firestoreのルールを確認してください。', { timeout: 3500 });
            }
        }

        function mergeById(cloudItems, localItems) {
            const result = Array.isArray(cloudItems) ? cloudItems.slice() : [];
            const seen = new Set(result.map(function (item) { return item && item.id; }).filter(Boolean));
            (Array.isArray(localItems) ? localItems : []).forEach(function (item) {
                if (item && item.id && !seen.has(item.id)) {
                    result.push(item);
                    seen.add(item.id);
                }
            });
            return result;
        }

        function localDataSnapshot() {
            return {
                tasks: tasks,
                genres: genres,
                memos: memos,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
        }

        function saveLocalData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            localStorage.setItem(GENRE_KEY, JSON.stringify(genres));
            localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
        }

        function scheduleCloudSave() {
            if (!cloudReady || !cloudUser || applyingCloudData) return;
            clearTimeout(cloudWriteTimer);
            cloudWriteTimer = setTimeout(async function () {
                try {
                    await db.collection('users').doc(cloudUser.uid).set(localDataSnapshot(), { merge: true });
                } catch (error) {
                    showSyncError('Firestore save failed: ' + error.code);
                }
            }, 250);
        }

        async function startCloudSync(user) {
            const thisGeneration = ++syncGeneration;
            cloudReady = false;
            cloudUser = user;
            if (cloudUnsubscribe) {
                cloudUnsubscribe();
                cloudUnsubscribe = null;
            }
            clearTimeout(cloudWriteTimer);
            if (!user) {
                cloudUser = null;
                return;
            }

            const docRef = db.collection('users').doc(user.uid);
            const migrationKey = 'onsenTodoCloudMigrated_' + user.uid;
            try {
                const doc = await docRef.get();
                if (thisGeneration !== syncGeneration || !auth.currentUser || auth.currentUser.uid !== user.uid) return;

                const localTasks = loadTasks();
                const localGenres = loadGenres();
                const localMemos = loadMemos();
                let data;

                if (doc.exists) {
                    const remote = doc.data() || {};
                    // 各端末のローカルデータは、端末ごとに一度だけクラウドへ統合する。
                    if (localStorage.getItem(migrationKey) !== '1') {
                        data = {
                            tasks: mergeById(remote.tasks, localTasks),
                            genres: mergeById(remote.genres, localGenres),
                            memos: mergeById(remote.memos, localMemos)
                        };
                        await docRef.set({
                            tasks: data.tasks,
                            genres: data.genres,
                            memos: data.memos,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                        localStorage.setItem(migrationKey, '1');
                    } else {
                        data = {
                            tasks: Array.isArray(remote.tasks) ? remote.tasks : [],
                            genres: Array.isArray(remote.genres) ? remote.genres : [],
                            memos: Array.isArray(remote.memos) ? remote.memos : []
                        };
                    }
                } else {
                    data = { tasks: localTasks, genres: localGenres, memos: localMemos };
                    await docRef.set({
                        tasks: data.tasks,
                        genres: data.genres,
                        memos: data.memos,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    localStorage.setItem(migrationKey, '1');
                }

                if (thisGeneration !== syncGeneration) return;
                applyingCloudData = true;
                tasks = Array.isArray(data.tasks) ? data.tasks : [];
                genres = Array.isArray(data.genres) ? data.genres : [];
                memos = Array.isArray(data.memos) ? data.memos : [];
                saveLocalData();
                renderTasks();
                applyingCloudData = false;
                cloudReady = true;

                cloudUnsubscribe = docRef.onSnapshot(function (snapshot) {
                    if (!snapshot.exists || thisGeneration !== syncGeneration) return;
                    const remote = snapshot.data() || {};
                    applyingCloudData = true;
                    tasks = Array.isArray(remote.tasks) ? remote.tasks : [];
                    genres = Array.isArray(remote.genres) ? remote.genres : [];
                    memos = Array.isArray(remote.memos) ? remote.memos : [];
                    try { saveLocalData(); } catch (e) { console.error('Local save failed', e); }
                    renderTasks();
                    applyingCloudData = false;
                    cloudReady = true;
                }, function (error) {
                    cloudReady = false;
                    showSyncError('Firestore listener failed: ' + error.code);
                });
            } catch (error) {
                applyingCloudData = false;
                cloudReady = false;
                showSyncError('Firestore sync failed: ' + error.code);
            }
        }

        // ---- Firebaseメールアドレス認証 ----
        function setAuthMessage(message) {

        async function signInOrRegister(mode) {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                setAuthMessage('メールアドレスとパスワードを入力してください。');
                return;
            }
            if (mode === 'register' && password.length < 6) {
                setAuthMessage('パスワードは6文字以上にしてください。');
                return;
            }

            setAuthMessage('処理中です…');
            try {
                if (mode === 'register') {
                    await auth.createUserWithEmailAndPassword(email, password);
                    setAuthMessage('登録しました。');
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    setAuthMessage('ログインしました。');
                }
            } catch (error) {
                let message = '処理できませんでした。入力内容とFirebaseの設定を確認してください。';
                if (error.code === 'auth/email-already-in-use') {
                    message = 'このメールアドレスは登録済みです。ログインを試してください。';
                } else if (error.code === 'auth/invalid-email') {
                    message = 'メールアドレスの形式を確認してください。';
                } else if (error.code === 'auth/weak-password') {
                    message = 'パスワードは6文字以上にしてください。';
                } else if (error.code === 'auth/invalid-credential' ||
                           error.code === 'auth/wrong-password' ||
                           error.code === 'auth/user-not-found') {
                    message = 'メールアドレスまたはパスワードを確認してください。';
                } else if (error.code === 'auth/operation-not-allowed') {
                    message = 'Firebase Consoleでメール/パスワード認証を有効にしてください。';
                } else if (error.code === 'auth/network-request-failed') {
                    message = '通信に失敗しました。ネットワークを確認してください。';
                }
                setAuthMessage(message);
                console.error('Firebase Authentication error:', error.code);
            }
        }

        // ---- 保存データの読み込み（壊れていても起動できるようにする）----
        function newId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function loadTasks() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!Array.isArray(saved)) return [];
                return saved
                    .filter(function (t) {
                        return t && typeof t.text === 'string' && t.text !== '';
                    })
                    .map(function (t) {
                        const p = Number(t.priority);
                        return {
                            id: typeof t.id === 'string' ? t.id : newId(), // 旧データにはIDを付与
                            text: t.text,
                            completed: Boolean(t.completed),
                            priority: p >= 1 && p <= 5 ? p : 3,
                            important: Boolean(t.important),
                            memo: typeof t.memo === 'string' ? t.memo : '',
                            genre: typeof t.genre === 'string' ? t.genre : '',
                            due: /^\d{4}-\d{2}-\d{2}$/.test(t.due) ? t.due : '',
                            time: /^\d{2}:\d{2}$/.test(t.time) ? t.time : ''
                        };
                    });
            } catch (e) {
                return [];
            }
        }

        let tasks = loadTasks();

        function saveTasks() {

        function genreById(id) {
            if (!id) return null;
            return genres.find(function (g) { return g.id === id; }) || null;
        }

            const g = genreById(id);

        // ジャンルのボタン（絞り込み用・追加ダイアログ用で共通）

            const chip = document.createElement('button');
            chip.type = 'button';

            if (active) chip.style.background = color || '#2d3748';

                dot.className = 'dot';
                dot.style.background = active ? '#fff' : color;
                chip.appendChild(dot);

            chip.appendChild(document.createTextNode(label));
            chip.addEventListener('click', onClick);
            return chip;

        function renderGenreBars() {
            // 各タブ上部の絞り込みバー
            document.querySelectorAll('[data-genre-filter]').forEach(function (bar) {
                bar.replaceChildren();
                bar.appendChild(makeChip('すべて', null, currentGenre === 'all', function () { selectGenre('all'); }));
                genres.forEach(function (g) {
                    bar.appendChild(makeChip(g.name, g.color, currentGenre === g.id, function () { selectGenre(g.id); }));
                });
                bar.appendChild(makeChip('未分類', NO_GENRE_COLOR, currentGenre === 'none', function () { selectGenre('none'); }));
                bar.appendChild(makeChip('＋ ジャンル', null, false, function () { openGenreDialog(); }));
                if (genres.length > 0) {
                    bar.appendChild(makeChip('✎ 編集', null, false, function () { openGenres(); }));
                }
            });
            // 追加ダイアログのジャンル選択

            if (addBar) {
                addBar.replaceChildren();
                addBar.appendChild(makeChip('なし', NO_GENRE_COLOR, addGenre === '', function () {
                    addGenre = '';
                    renderGenreBars();
                }));
                genres.forEach(function (g) {
                    addBar.appendChild(makeChip(g.name, g.color, addGenre === g.id, function () {

            if (name === '') {
                ons.notification.toast('ジャンル名を入力してください', { timeout: 1800 });
                input.focus();
                return;
            }
            const g = genreById(editingGenreId);
            if (g) {
                g.name = name;
                g.color = draftColor;
            } else {
                const created = { id: newId(), name: name, color: draftColor };
                genres.push(created);
                // タスク追加画面から作った場合は、そのジャンルを選んだ状態にする
                if (document.getElementById('addDialog').visible) addGenre = created.id;
            }
            saveGenres();

            closeGenreDialog();

        function deleteGenre(id) {
            const g = genreById(id || editingGenreId);
            if (!g) return;
            ons.notification.confirm(
                '「' + g.name + '」を削除しますか？ このジャンルのタスクは「未分類」になります。',
                { buttonLabels: ['キャンセル', '削除'] }
            ).then(function (index) {
                if (index !== 1) return;
                genres = genres.filter(function (x) { return x.id !== g.id; });
                tasks.forEach(function (t) { if (t.genre === g.id) t.genre = ''; });
                if (currentGenre === g.id) currentGenre = 'all';
                if (addGenre === g.id) addGenre = '';
                saveGenres();
                saveTasks();
                renderTasks();
                closeGenreDialog();
            });
        }

            if (timeInput.value && !dueInput.value) {

                dueInput.focus();
                return;
            }

            tasks.push({
                id: newId(),
                text: text,
                completed: false,
                priority: Number(range.value),
                important: importantSwitch.checked,
                memo: memoInput.value.trim(),
                genre: genreById(addGenre) ? addGenre : '',
                due: dueInput.value,
                time: timeInput.value
            });

            input.value = '';
            memoInput.value = '';
            dueInput.value = '';

            importantSwitch.checked = false;
            updatePriority();
            saveTasks();
            renderTasks();
            closeAddDialog();

        // ---- 期限の扱い ----
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        // 期限の開始日時を返す（期限がなければ null）
        function parseDue(task) {
            if (!task.due) return null;
            const d = task.due.split('-').map(Number);
            if (!d[0] || !d[1] || !d[2]) return null;
            if (task.time) {
                const t = task.time.split(':').map(Number);
                return new Date(d[0], d[1] - 1, d[2], t[0] || 0, t[1] || 0);
            }
            return new Date(d[0], d[1] - 1, d[2]);
        }

        function isOverdue(task) {
            const start = parseDue(task);
            if (!start || task.completed) return false;
            // 時刻なしの期限は、その日の終わりまで有効
            const limit = task.time
                ? start
                : new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
            return limit < new Date();
        }

        function formatDueLabel(task) {
            return task.due.replace(/-/g, '/') + (task.time ? ' ' + task.time : '');
        }

        // ---- アプリ内カレンダー（月表示）----
        function toDateKey(d) {
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        const now0 = new Date();
        let calYear = now0.getFullYear();
        let calMonth = now0.getMonth(); // 0〜11
        let calSelected = toDateKey(now0);

        function changeMonth(delta) {
            const d = new Date(calYear, calMonth + delta, 1);
            calYear = d.getFullYear();
            calMonth = d.getMonth();
            // 表示月が今月なら今日、それ以外は1日を選択
            const today = new Date();
            const isThisMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;
            calSelected = toDateKey(isThisMonth ? today : d);
            renderCalendar();
        }

        function goToday() {
            const today = new Date();
            calYear = today.getFullYear();
            calMonth = today.getMonth();
            calSelected = toDateKey(today);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const title = document.getElementById('calTitle');
            const heading = document.getElementById('calDayHeading');
            const dayList = document.getElementById('calDayList');
            const dayEmpty = document.getElementById('calDayEmpty');
            // カレンダーのページがまだ生成されていなければ何もしない
            if (!grid || !title || !heading || !dayList || !dayEmpty) return;

            title.textContent = calYear + '年' + (calMonth + 1) + '月';
            grid.replaceChildren();

            ['日', '月', '火', '水', '木', '金', '土'].forEach(function (w, i) {
                const cell = document.createElement('div');
                cell.className = 'cal-weekday' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
                cell.textContent = w;
                grid.appendChild(cell);
            });

            const firstWeekday = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const todayKey = toDateKey(new Date());

            // 日付ごとのタスク
            const byDate = {};
            tasks.filter(matchesGenre).forEach(function (task) {
                if (task.due) (byDate[task.due] = byDate[task.due] || []).push(task);
            });

            for (let i = 0; i < firstWeekday; i++) {
                const blank = document.createElement('div');
                blank.className = 'cal-blank';
                grid.appendChild(blank);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const key = calYear + '-' + pad(calMonth + 1) + '-' + pad(day);
                const weekday = (firstWeekday + day - 1) % 7;
                const dayTasks = byDate[key] || [];
                const button = document.createElement('button');
                const num = document.createElement('span');

                button.type = 'button';
                button.className = 'cal-day'
                    + (weekday === 0 ? ' sun' : weekday === 6 ? ' sat' : '')
                    + (key === todayKey ? ' today' : '')
                    + (key === calSelected ? ' selected' : '');
                button.setAttribute('aria-label',
                    (calMonth + 1) + '月' + day + '日 タスク' + dayTasks.length + '件');
                num.className = 'cal-num';
                num.textContent = day;
                button.appendChild(num);

                if (dayTasks.length > 0) {
                    const mark = document.createElement('span');
                    const dot = document.createElement('span');
                    const count = document.createElement('span');
                    const open = dayTasks.filter(function (t) { return !t.completed; });
                    mark.className = 'cal-mark';
                    dot.className = 'cal-dot'
                        + (open.length === 0 ? ' done' : open.some(isOverdue) ? ' overdue' : '');
                    count.textContent = dayTasks.length;
                    mark.append(dot, count);
                    button.appendChild(mark);
                }

                button.addEventListener('click', function () {
                    calSelected = key;
                    renderCalendar();
                });
                grid.appendChild(button);
            }

            // 選択した日のタスク一覧
            const parts = calSelected.split('-').map(Number);
            heading.textContent = parts[0] + '年' + parts[1] + '月' + parts[2] + '日のタスク';
            dayList.replaceChildren();
            const selectedTasks = sortedTasks(byDate[calSelected] || []);
            if (selectedTasks.length === 0) {
                dayEmpty.textContent = 'この日のタスクはありません。右下の「＋」で追加できます。';
                dayEmpty.hidden = false;
            } else {
                dayEmpty.hidden = true;
                selectedTasks.forEach(function (task) {
                    dayList.appendChild(buildTaskItem(task));
                });
            }
        }

        // ---- 一覧の描画 ----
        // 重要タスク → 優先度の高い順（同順位は追加順）
        function sortedTasks(list) {
            return list
                .map(function (task, index) { return { task: task, index: index }; })
                .sort(function (a, b) {
                    return (Number(b.task.important) - Number(a.task.important))
                        || (b.task.priority - a.task.priority)
                        || (a.index - b.index);
                })
                .map(function (entry) { return entry.task; });
        }

        // 1件分のタスク行を作る（各タブとカレンダーで共通）
        function buildTaskItem(task) {
            const item = document.createElement('ons-list-item');
            const row = document.createElement('div');
            const checkbox = document.createElement('ons-checkbox');
            const textArea = document.createElement('div');
            const title = document.createElement('div');
            const details = document.createElement('small');
            const deleteButton = document.createElement('ons-button');

            row.className = 'todo-row';
            row.style.borderLeft = '4px solid ' + genreColor(task.genre);
            row.style.paddingLeft = '8px';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', function () {
                task.completed = checkbox.checked; // 配列内のオブジェクトを直接更新
                saveTasks();
                // ToDo⇄完了のタブでは、行が消えて移ることが分かるよう少し薄くしてから描画し直す
                const listId = item.parentElement ? item.parentElement.id : '';
                const moving = (listId === 'openList' && task.completed)
                    || (listId === 'doneList' && !task.completed);
                if (moving) {
                    item.style.transition = 'opacity 0.3s';
                    item.style.opacity = '0';
                    setTimeout(renderTasks, 300);
                } else {
                    renderTasks();
                }
            });

            textArea.className = 'todo-text';
            title.className = 'todo-title'
                + (task.completed ? ' completed' : '')
                + (task.important ? ' important' : '');
            title.textContent = (task.important ? '★ ' : '') + task.text;
            details.className = 'task-details';
            details.textContent = '優先度 ' + task.priority + ' / 5'
                + (task.important ? ' ・重要' : '');
            textArea.append(title, details);

            if (task.due) {
                const due = document.createElement('small');
                due.className = 'task-details task-due' + (isOverdue(task) ? ' overdue' : '');
                due.textContent = '期限 ' + formatDueLabel(task) + (isOverdue(task) ? '（期限切れ）' : '');
                textArea.appendChild(due);
            }
            if (task.memo) {
                const memo = document.createElement('div');
                memo.className = 'task-memo';
                memo.textContent = task.memo; // textContent なので HTML は実行されない
                textArea.appendChild(memo);
            }

            // ジャンル表示（タップで付け替え）
            const g = genreById(task.genre);
            const tag = document.createElement('button');
            const tagDot = document.createElement('span');
            tag.type = 'button';
            tag.className = 'genre-tag';
            tagDot.className = 'dot';
            tagDot.style.background = genreColor(task.genre);
            tag.append(tagDot, document.createTextNode(g ? g.name : '未分類'));
            tag.addEventListener('click', function () { changeTaskGenre(task); });
            textArea.appendChild(tag);

            deleteButton.setAttribute('modifier', 'quiet');
            deleteButton.textContent = '削除';
            deleteButton.addEventListener('click', function () {
                tasks = tasks.filter(function (t) { return t.id !== task.id; });
                saveTasks();
                renderTasks();
            });

            row.append(checkbox, textArea, deleteButton);
            item.appendChild(row);
            return item;
        }

        function renderList(listId, emptyId, summaryId, filter) {
            const list = document.getElementById(listId);
            const emptyMessage = document.getElementById(emptyId);
            const summary = document.getElementById(summaryId);
            // そのタブのページがまだ生成されていなければ何もしない（生成時の init で再描画される）
            if (!list || !emptyMessage || !summary) return;

            let scoped = tasks.filter(matchesGenre);
            if (filter === 'today') {
                const todayKey = toDateKey(new Date());
                scoped = scoped.filter(function (task) { return task.due === todayKey; });
            }
            const unfinished = scoped.filter(function (task) {
                return !task.completed;
            }).length;
            summary.textContent =
                '未完了 ' + unfinished + '件 / 全' + scoped.length + '件';
            list.replaceChildren();

            const visibleTasks = sortedTasks(scoped.filter(function (task) {
                if (filter === 'open') return !task.completed;
                if (filter === 'done') return task.completed;
                return true;
            }));

            if (visibleTasks.length === 0) {
                emptyMessage.textContent = filter === 'open'
                    ? 'ToDoはありません。'
                    : filter === 'done'
                        ? '完了したタスクはありません。'
                        : '今日が期限のタスクはありません。右下の「＋」から追加できます。';
                emptyMessage.hidden = false;
                return;
            }
            emptyMessage.hidden = true;

            visibleTasks.forEach(function (task) {
                list.appendChild(buildTaskItem(task));
            });
        }

        function renderTasks() {
            renderList('allList', 'allEmpty', 'summaryAll', 'today');
            renderList('openList', 'openEmpty', 'summaryOpen', 'open');
            renderList('doneList', 'doneEmpty', 'summaryDone', 'done');
            renderGenreBars();
            renderGenreList();
            renderCalendar();
            renderMemos();
        }

        ons.ready(function () {
            // ページ（各タブ）が生成されるたびに描画する。
            // これで再読み込み直後も、保存済みタスクが最初から表示される。
            document.addEventListener('init', function () {
                renderTasks();
                // タブ切り替え時に、メモタブでは追加ボタンを隠す（1回だけ登録）
                const tabs = document.getElementById('filterTabs');
                if (tabs && !tabs.dataset.bound) {
                    tabs.dataset.bound = '1';
                    tabs.addEventListener('postchange', updateFab);
                }
            });

            // Enterキーで追加
            document.getElementById('taskInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.isComposing) addTask(); // 日本語変換中のEnterは除く
            });

            renderTasks();
        });
    </script>
</body>
